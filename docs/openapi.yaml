# =============================================================================
# Funnel Builder - Management-API v1
# =============================================================================
#
# Diese Datei ist die Single Source of Truth der Management-API (FB-030a).
# Spezifikation zuerst, Code danach: Ein Endpunkt wird hier beschrieben, bevor
# er implementiert wird. Weicht der Code von dieser Datei ab, ist der Code der
# Fehler.
#
# Jede Operation traegt zwei projekteigene Erweiterungen:
#
#   x-status   implemented | planned
#              "implemented" heisst: die Route existiert in routes/api.php.
#              Der Contract-Test (tests/Feature/Funnel/OpenApiContractTest.php)
#              prueft genau diese Operationen gegen Laravels Routenliste und
#              ueberspringt die geplanten nachvollziehbar.
#   x-ticket   Das Ticket, das die Operation liefert (docs/funnel-builder/tickets.md).
#
# Bearbeitungsregeln:
#   - Berechtigungen kommen aus App\Constants\TenantApiAbility. Neue Werte
#     gehoeren zuerst in das Enum, dann hierher; der Contract-Test haelt beide
#     deckungsgleich.
#   - Wird ein geplanter Endpunkt implementiert, wird sein x-status auf
#     "implemented" gesetzt - sonst prueft ihn niemand.
#   - Kontaktdaten: siehe LeadMasked / LeadFull. Es gibt kein Lead-Schema mit
#     optionalen Kontaktfeldern, und es wird auch keines geben.
#
# Stand der Modellierung: Funnel, Schritte, Fragen, Optionen, Verzweigungsregeln
# und Ergebnis-Screens sind gegen das gelieferte Schema aus FB-010 modelliert.
# Wo eine Tabelle noch fehlt (funnel_versions aus FB-014, funnel_themes aus
# FB-017, leads aus FB-031, funnel_webhooks aus FB-030e), legt diese Datei den
# Vertrag fest, den die Umsetzung einzuhalten hat.
#
# =============================================================================

openapi: 3.1.1

info:
  title: Funnel Builder Management-API
  version: 1.0.0
  summary: Verwaltung von Lead-Funnels, Leads und Webhooks je Workspace.
  description: |
    Die Management-API des Funnel Builders. Ueber sie legen externe Systeme
    Funnels an, veroeffentlichen sie, lesen die daraus entstehenden Leads und
    abonnieren Ereignisse per Webhook.

    ## Authentifizierung

    Jede Anfrage traegt ein Sanctum-Token im `Authorization`-Header:

    ```
    Authorization: Bearer 12|AbCdEf...
    ```

    Ein Token gehoert einem **Workspace** (Tenant), nicht einem einzelnen
    Benutzer. Es erreicht ausschliesslich die Daten seines eigenen Workspaces;
    diese Isolation ist eine Eigenschaft des Modells, keine Regel, die einzelne
    Endpunkte einhalten muessten. Tokens werden im Dashboard unter
    "API-Zugaenge" erstellt und widerrufen (FB-006).

    ## Berechtigungen

    Ein Token traegt genau die Berechtigungen, die beim Anlegen ausgewaehlt
    wurden. Jede Operation nennt unter `x-required-abilities`, welche sie
    voraussetzt; fehlt sie, antwortet die API mit `403`. Die vollstaendige
    Liste steht unter der Erweiterung `x-abilities` am Ende dieses Dokuments
    und entspricht `App\Constants\TenantApiAbility`.

    ## Kontaktdaten von Leads

    Vor dem Kauf eines Leads sind seine Kontaktdaten maskiert, nach dem Kauf im
    Klartext. Die Maskierung geschieht serverseitig, bevor die Daten die
    Response erreichen. Beides sind getrennte Schemas: `LeadMasked` und
    `LeadFull`, unterschieden ueber das Feld `contact_visibility`. Ein Client
    darf sich darauf verlassen, dass ein `LeadMasked` niemals einen
    unmaskierten Wert enthaelt.

    ## Fehler

    Alle Fehlerantworten folgen RFC 9457 (Problem Details) mit dem Medientyp
    `application/problem+json`.

    ## Adressierung

    Ein Funnel wird ueber seinen `public_token` adressiert - einen nicht
    erratbaren ULID, der zugleich sein Route-Key ist. Fortlaufende IDs eines
    Funnels verlassen die API nicht.

    Die untergeordneten Bausteine eines Funnels (Schritte, Fragen,
    Antwortoptionen, Verzweigungsregeln, Ergebnis-Screens) tragen im Schema aus
    FB-010 keinen eigenen oeffentlichen Schluessel und werden deshalb ueber ihre
    Datenbank-ID adressiert. Das ist unbedenklich, weil sie nur innerhalb eines
    Funnels erreichbar sind, den das Token ohnehin besitzt: Der Pfad wird immer
    zuerst gegen den Funnel des Tokens aufgeloest, eine fremde ID ergibt `404`.

    Leads werden ueber eine UUID adressiert. Ihre fortlaufende ID verlaesst die
    API nicht - anders als die Bausteine eines Funnels sind Leads zwischen
    Workspaces handelbar, ihre Kennungen also nicht auf einen Besitzer begrenzt.
  contact:
    name: Funnel Builder
    url: https://github.com/enesk/widileads
  license:
    name: proprietaer
    identifier: LicenseRef-Proprietary

externalDocs:
  description: Ticketset, Datenmodell, Snapshot-Format und Architekturleitsaetze
  url: https://github.com/enesk/widileads/tree/main/docs/funnel-builder

servers:
  - url: /api/v1
    description: Diese Installation

security:
  - bearerAuth: []

tags:
  - name: Konto
    description: Auskunft ueber das verwendete Token und seinen Workspace.
  - name: Funnels
    description: Anlegen, Lesen, Aendern und Loeschen von Funnels.
  - name: Funnel-Struktur
    description: |
      Schritte, Fragen, Antwortoptionen, Verzweigungslogik und Ergebnis-Screens.
      Die komplette Struktur laesst sich alternativ in einem einzigen Aufruf
      schreiben (`PUT /funnels/{funnel}/structure`).
  - name: Veroeffentlichung
    description: Publizieren, Duplizieren, Archivieren und die Versionshistorie.
  - name: Leads
    description: Die aus Funnels entstandenen Anfragen.
  - name: Webhooks
    description: Verwaltung der Ereignis-Abonnements je Funnel.

paths:

  # ---------------------------------------------------------------------------
  # Konto (FB-006, implementiert)
  # ---------------------------------------------------------------------------

  /me:
    get:
      operationId: showCurrentTenant
      tags: [Konto]
      summary: Workspace des verwendeten Tokens
      description: |
        Gibt den Workspace zurueck, zu dem das verwendete Token gehoert, samt
        seiner Berechtigungen. Dient Integrationen dazu, ein Token zu pruefen,
        ohne dafuer einen fachlichen Endpunkt anzusprechen.
      x-status: implemented
      x-ticket: FB-006
      x-required-abilities: []
      responses:
        '200':
          description: Der Workspace des Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ping/leads:
    get:
      operationId: pingLeads
      tags: [Konto]
      summary: Sonde fuer die Berechtigungspruefung
      description: |
        Antwortet nur, wenn das Token die Berechtigung `leads:read` traegt.
        Ersetzt keinen fachlichen Endpunkt - die kommen ab FB-030b und tragen
        dieselbe Pruefung.
      x-status: implemented
      x-ticket: FB-006
      x-required-abilities: ['leads:read']
      responses:
        '200':
          description: Das Token traegt die Berechtigung.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # Funnels (FB-030b, geplant)
  # ---------------------------------------------------------------------------

  /funnels:
    get:
      operationId: listFunnels
      tags: [Funnels]
      summary: Funnels auflisten
      description: Alle Funnels des Workspaces, seitenweise und filterbar.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          description: Auf einen Lebenszyklus-Zustand einschraenken.
          required: false
          schema:
            $ref: '#/components/schemas/FunnelStatus'
        - name: search
          in: query
          description: Volltextsuche ueber Name und Slug.
          required: false
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          description: Sortierfeld. Ein vorangestelltes `-` kehrt die Richtung um.
          required: false
          schema:
            type: string
            enum: [name, created_at, updated_at, -name, -created_at, -updated_at]
            default: -created_at
      responses:
        '200':
          description: Seite mit Funnels.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedCollection'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Funnel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      operationId: createFunnel
      tags: [Funnels]
      summary: Funnel anlegen
      description: |
        Legt einen leeren Funnel im Zustand `draft` an. Sein `public_token` wird
        serverseitig erzeugt; ohne `slug` wird er aus dem Namen abgeleitet. Die
        Struktur wird anschliessend entweder ueber die feingranularen Endpunkte
        oder in einem Zug ueber `PUT /funnels/{funnel}/structure` geschrieben.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelWriteRequest'
      responses:
        '201':
          $ref: '#/components/responses/FunnelCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /funnels/{funnel}:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    get:
      operationId: showFunnel
      tags: [Funnels]
      summary: Funnel lesen
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:read']
      responses:
        '200':
          $ref: '#/components/responses/FunnelOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFunnel
      tags: [Funnels]
      summary: Funnel aendern
      description: |
        Aendert die Stammdaten des Funnels. Die Struktur bleibt unberuehrt;
        dafuer sind die Struktur-Endpunkte zustaendig. Der Zustand laesst sich
        hier nicht setzen - dafuer gibt es `publish` und `archive`.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelWriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/FunnelOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteFunnel
      tags: [Funnels]
      summary: Funnel loeschen
      description: |
        Loescht einen Funnel samt seiner Struktur. Ein Funnel, zu dem bereits
        Leads existieren, wird nicht geloescht, sondern mit `409` abgewiesen -
        sonst verloeren die Leads ihren Ursprung. Er ist zu archivieren.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Komplette Struktur in einem Aufruf (FB-030b, geplant)
  # ---------------------------------------------------------------------------

  /funnels/{funnel}/structure:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    get:
      operationId: showFunnelStructure
      tags: [Funnel-Struktur]
      summary: Komplette Struktur lesen
      description: |
        Liefert Schritte, Fragen, Optionen, Verzweigungsregeln und
        Ergebnis-Screens des Funnels in genau dem Format, das `PUT` wieder
        entgegennimmt. Es ist zugleich das Format der Snapshots in
        `funnel_versions` (FB-014) und der Seed-Vorlagen (FB-019).
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:read']
      responses:
        '200':
          $ref: '#/components/responses/StructureOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceFunnelStructure
      tags: [Funnel-Struktur]
      summary: Komplette Struktur schreiben
      description: |
        Nimmt die vollstaendige Struktur entgegen und schreibt sie transaktional
        in die Live-Tabellen: Vorhandenes wird abgeglichen, Fehlendes geloescht,
        Neues angelegt. Damit legt ein externes System einen kompletten Funnel in
        einem einzigen Aufruf an.

        Entweder gelingt der gesamte Aufruf oder gar nichts - eine halb
        geschriebene Struktur gibt es nicht. Schlaegt die Validierung fehl,
        bleibt der Funnel unveraendert.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelStructure'
      responses:
        '200':
          $ref: '#/components/responses/StructureOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------------------
  # Veroeffentlichung und Versionen (FB-030c, geplant)
  # ---------------------------------------------------------------------------

  /funnels/{funnel}/publish:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    post:
      operationId: publishFunnel
      tags: [Veroeffentlichung]
      summary: Funnel veroeffentlichen
      description: |
        Validiert den Entwurf (mindestens ein Schritt, Kontaktfelder vorhanden,
        lueckenlose und ueberschneidungsfreie Punktebereiche), friert die
        Struktur als neuen Snapshot in `funnel_versions` ein und setzt den
        Zustand auf `published`. Laufende Sitzungen bleiben auf ihrer bisherigen
        Version. Loest das Ereignis `funnel.published` aus.

        Scheitert die Validierung, antwortet die API mit `422` und nennt die
        beanstandeten Stellen in `errors`.
      x-status: planned
      x-ticket: FB-030c
      x-required-abilities: ['funnels:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: Freitext zur Aenderung, erscheint in der Versionshistorie.
      responses:
        '201':
          description: Die veroeffentlichte Version.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FunnelVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /funnels/{funnel}/duplicate:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    post:
      operationId: duplicateFunnel
      tags: [Veroeffentlichung]
      summary: Funnel duplizieren
      description: |
        Legt eine tiefe Kopie des Funnels samt Struktur im Zustand `draft` an.
        Die Kopie erhaelt einen eigenen `public_token`; Leads und
        Versionshistorie werden nicht mitkopiert.
      x-status: planned
      x-ticket: FB-030c
      x-required-abilities: ['funnels:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Name der Kopie. Ohne Angabe wird der Name um einen Zusatz ergaenzt.
                slug:
                  type: string
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                  maxLength: 255
      responses:
        '201':
          $ref: '#/components/responses/FunnelCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /funnels/{funnel}/archive:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    post:
      operationId: archiveFunnel
      tags: [Veroeffentlichung]
      summary: Funnel archivieren
      description: |
        Setzt den Zustand auf `archived` und nimmt den Funnel damit aus der
        oeffentlichen Auslieferung. Bestehende Leads bleiben erhalten und
        weiterhin lesbar.
      x-status: planned
      x-ticket: FB-030c
      x-required-abilities: ['funnels:write']
      responses:
        '200':
          $ref: '#/components/responses/FunnelOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /funnels/{funnel}/versions:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    get:
      operationId: listFunnelVersions
      tags: [Veroeffentlichung]
      summary: Versionshistorie auflisten
      description: Alle veroeffentlichten Snapshots, neueste zuerst - ohne Snapshot-Inhalt.
      x-status: planned
      x-ticket: FB-030c
      x-required-abilities: ['funnels:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Seite mit Versionen.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedCollection'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunnelVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /funnels/{funnel}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      operationId: showFunnelVersion
      tags: [Veroeffentlichung]
      summary: Version samt Snapshot lesen
      description: |
        Liefert eine einzelne Version einschliesslich ihres Snapshots. Der
        Snapshot hat dasselbe Format wie `GET /funnels/{funnel}/structure` und
        laesst sich unveraendert in einen anderen Funnel einspielen.
      x-status: planned
      x-ticket: FB-030c
      x-required-abilities: ['funnels:read']
      responses:
        '200':
          description: Die Version samt Snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FunnelVersionWithSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Feingranulare Struktur-Endpunkte (FB-030b, geplant)
  #
  # Sie erledigen dasselbe wie PUT /structure, nur ressourcenweise - fuer
  # Clients, die eine einzelne Frage aendern, statt den ganzen Funnel zu senden.
  # ---------------------------------------------------------------------------

  /funnels/{funnel}/steps:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
    get:
      operationId: listFunnelSteps
      tags: [Funnel-Struktur]
      summary: Schritte auflisten
      description: Alle Schritte des Funnels, aufsteigend nach `position`.
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:read']
      responses:
        '200':
          $ref: '#/components/responses/StepList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createFunnelStep
      tags: [Funnel-Struktur]
      summary: Schritt anlegen
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelStepWriteRequest'
      responses:
        '201':
          $ref: '#/components/responses/StepCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /funnels/{funnel}/steps/{step}:
    parameters:
      - $ref: '#/components/parameters/FunnelToken'
      - $ref: '#/components/parameters/StepId'
    get:
      operationId: showFunnelStep
      tags: [Funnel-Struktur]
      summary: Schritt lesen
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:read']
      responses:
        '200':
          $ref: '#/components/responses/StepOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFunnelStep
      tags: [Funnel-Struktur]
      summary: Schritt aendern
      x-status: planned
      x-ticket: FB-030b
      x-required-abilities: ['funnels:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelStepWriteRequest'
      responses:
        '200':
          $ref: '#/components/responses/StepOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
