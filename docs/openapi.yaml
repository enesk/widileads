  # ---------------------------------------------------------------------------
  # Leads (FB-030d, geplant)
  # ---------------------------------------------------------------------------

  /leads:
    get:
      operationId: listLeads
      tags: [Leads]
      summary: Leads auflisten
      description: |
        Die Leads des Workspaces, seitenweise und filterbar.

        **Maskierung:** Jeder Eintrag ist entweder ein `LeadMasked` oder ein
        `LeadFull`, erkennbar am Feld `contact_visibility`. Welche Auspraegung
        ausgeliefert wird, entscheidet der Server je Lead anhand von Rolle und
        Kaufstatus - nicht der Client, und nicht ueber einen Parameter. Eine
        Liste kann beide Auspraegungen mischen: gekaufte Leads im Klartext, die
        uebrigen maskiert.
      x-status: planned
      x-ticket: FB-030d
      x-required-abilities: ['leads:read']
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: funnel
          in: query
          description: Auf einen Funnel einschraenken (dessen `public_token`).
          required: false
          schema:
            $ref: '#/components/schemas/PublicToken'
        - name: state
          in: query
          description: |
            Auf einen oder mehrere Zustaende einschraenken. Mehrfach angebbar
            (`?state[]=verfuegbar&state[]=verkauft`).
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LeadState'
        - name: created_from
          in: query
          description: Nur Leads ab diesem Zeitpunkt (einschliesslich).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_until
          in: query
          description: Nur Leads bis zu diesem Zeitpunkt (einschliesslich).
          required: false
          schema:
            type: string
            format: date-time
        - name: postal_code_prefix
          in: query
          description: |
            Regionsfilter ueber die ersten Stellen der Postleitzahl. Er wirkt
            auch dann, wenn die Postleitzahl im Ergebnis maskiert ist - gefiltert
            wird serverseitig auf dem Klartext.
          required: false
          schema:
            type: string
            pattern: '^[0-9]{1,5}$'
        - name: score_min
          in: query
          description: Mindestpunktzahl der Qualifizierung.
          required: false
          schema:
            type: integer
        - name: score_max
          in: query
          description: Hoechstpunktzahl der Qualifizierung.
          required: false
          schema:
            type: integer
        - name: stale
          in: query
          description: |
            Nur Liegenbleiber: Leads, die laenger als
            `config('funnel.lead.stale_after_days')` im Zustand `verfuegbar`
            stehen.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: Sortierfeld. Ein vorangestelltes `-` kehrt die Richtung um.
          required: false
          schema:
            type: string
            enum: [created_at, score, -created_at, -score]
            default: -created_at
      responses:
        '200':
          description: Seite mit Leads.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedCollection'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Lead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /leads/{lead}:
    parameters:
      - $ref: '#/components/parameters/LeadId'
    get:
      operationId: showLead
      tags: [Leads]
      summary: Lead lesen
      description: |
        Ein einzelner Lead. Fuer die Maskierung gilt dasselbe wie bei
        `GET /leads`: Der Server entscheidet, ob `LeadMasked` oder `LeadFull`
