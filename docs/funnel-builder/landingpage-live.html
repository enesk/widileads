document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eholder-count=\"3\">\n                <button type=\"button\" onclick=\"{{ t.select }}\" style=\"flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 2px solid {{ t.border }}; background: {{ t.bg }}; color: {{ t.color }}; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease\">{{ t.label }}<\/button>\n              <\/sc-for>\n            <\/div>\n            <sc-if value=\"{{ hasErrTierart }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errTierart }}<\/div><\/sc-if>\n          <\/div>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n            <div style=\"flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pf-rasse\" style=\"font-size: 13.5px; font-weight: 700\">Rasse<\/label>\n              <input id=\"pf-rasse\" type=\"text\" placeholder=\"z. B. Labrador\" value=\"{{ formRasse }}\" onchange=\"{{ setRasse }}\" style=\"min-height: 48px; border-radius: 12px; border: 2px solid #D6E3EF; padding: 0 14px; font-size: 16px; color: #14233C; outline: none; background: #FFFFFF; width: 100%; box-sizing: border-box\" style-focus=\"border-color: #007AB3\">\n              <sc-if value=\"{{ hasErrRasse }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errRasse }}<\/div><\/sc-if>\n            <\/div>\n            <div style=\"flex: 1 1 110px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pf-alter\" style=\"font-size: 13.5px; font-weight: 700\">Alter des Tiers<\/label>\n              <input id=\"pf-alter\" type=\"text\" placeholder=\"z. B. 3 Jahre\" value=\"{{ formAlter }}\" onchange=\"{{ setAlter }}\" inputmode=\"numeric\" style=\"min-height: 48px; border-radius: 12px; border: 2px solid #D6E3EF; padding: 0 14px; font-size: 16px; color: #14233C; outline: none; background: #FFFFFF; width: 100%; box-sizing: border-box\" style-focus=\"border-color: #007AB3\">\n              <sc-if value=\"{{ hasErrTierAlter }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errTierAlter }}<\/div><\/sc-if>\n            <\/div>\n          <\/div>\n\n          <div>\n            <div style=\"font-size: 13.5px; font-weight: 700; margin-bottom: 8px; color: #14233C\">Gesundheitszustand des Tiers<\/div>\n            <div style=\"display: flex; gap: 8px\">\n              <sc-for list=\"{{ gesundheitOptionen }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <button type=\"button\" onclick=\"{{ g.select }}\" style=\"flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 2px solid {{ g.border }}; background: {{ g.bg }}; color: {{ g.color }}; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease\">{{ g.label }}<\/button>\n              <\/sc-for>\n            <\/div>\n            <sc-if value=\"{{ hasErrGesundheit }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errGesundheit }}<\/div><\/sc-if>\n          <\/div>\n\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pf-name\" style=\"font-size: 13.5px; font-weight: 700\">Dein Name<\/label>\n            <input id=\"pf-name\" type=\"text\" placeholder=\"z. B. Alex Schmidt\" value=\"{{ formName }}\" onchange=\"{{ setName }}\" autocomplete=\"name\" style=\"min-height: 48px; border-radius: 12px; border: 2px solid #D6E3EF; padding: 0 14px; font-size: 16px; color: #14233C; outline: none; background: #FFFFFF\" style-focus=\"border-color: #007AB3\">\n              <sc-if value=\"{{ hasErrName }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errName }}<\/div><\/sc-if>\n          <\/div>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n            <div style=\"flex: 1 1 110px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pf-halter-alter\" style=\"font-size: 13.5px; font-weight: 700\">Dein Alter<\/label>\n              <input id=\"pf-halter-alter\" type=\"text\" placeholder=\"z. B. 35\" value=\"{{ formHalterAlter }}\" onchange=\"{{ setHalterAlter }}\" inputmode=\"numeric\" style=\"min-height: 48px; border-radius: 12px; border: 2px solid #D6E3EF; padding: 0 14px; font-size: 16px; color: #14233C; outline: none; background: #FFFFFF; width: 100%; box-sizing: border-box\" style-focus=\"border-color: #007AB3\">\n              <sc-if value=\"{{ hasErrHalterAlter }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errHalterAlter }}<\/div><\/sc-if>\n            <\/div>\n            <div style=\"flex: 1 1 110px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pf-plz\" style=\"font-size: 13.5px; font-weight: 700\">PLZ<\/label>\n              <input id=\"pf-plz\" type=\"text\" placeholder=\"z. B. 10115\" value=\"{{ formPlz }}\" onchange=\"{{ setPlz }}\" inputmode=\"numeric\" autocomplete=\"postal-code\" style=\"min-height: 48px; border-radius: 12px; border: 2px solid #D6E3EF; padding: 0 14px; font-size: 16px; color: #14233C; outline: none; background: #FFFFFF; width: 100%; box-sizing: border-box\" style-focus=\"border-color: #007AB3\">\n              <sc-if value=\"{{ hasErrPlz }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; font-weight: 600; color: #B43030\">{{ errPlz }}<\/div><\/sc-if>\n            <\/div>\n          <\/div>\n\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pf-email\" style=\"font-size: 13.5px; font-weight: 700\">Deine E-Mail<\/label>\n            <input id=\"pf-email\" type=\"email\" placeholder=\"name@beispiel.de\" value=\"{{ formEmail }}\" gap: 14px; padding: 18px 4px\">\n          <div style=\"width: 64px; height: 64px; border-radius: 50%; background: #E6F4EC; color: #1F8A5B; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800\">✓<\/div>\n          <div style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.4px\">Danke, {{ formName }}!<\/div>\n          <div style=\"font-size: 15.5px; color: #5B6B83; line-height: 1.55\">Dein persönliches Angebot für <strong style=\"color: #14233C\">{{ tierLabel }}<\/strong> ist unterwegs an<br><strong style=\"color: #14233C\">{{ formEmail }}<\/strong><\/div>\n          <div style=\"font-size: 15.5px; color: #5B6B83; line-height: 1.55\">Bei Rückfragen rufen wir dich kurz an unter<br><strong style=\"color: #14233C\">{{ formPhone }}<\/strong><\/div>\n          <div style=\"font-size: 13.5px; color: #8294AC\">Schau auch in deinen Spam-Ordner — sicher ist sicher.<\/div>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section data-screen-label=\"Trust-Zahlen\" style=\"background: #FFFFFF; border-bottom: 1px solid #EDF3F8\">\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: clamp(36px, 5vw, 56px) 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(28px, 4vw, 40px)\">\n    <div style=\"text-align: center\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #8294AC\">Versicherte Tiere<\/div>\n      <div style=\"margin-top: 8px; font-size: clamp(26px, 3vw, 34px); font-weight: 800; color: #003781; letter-spacing: -0.8px; line-height: 1.1\">1.200+<\/div>\n    <\/div>\n    <div style=\"text-align: center\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #8294AC\">Erfahrung am Markt<\/div>\n      <div style=\"margin-top: 8px; font-size: clamp(26px, 3vw, 34px); font-weight: 800; color: #003781; letter-spacing: -0.8px; line-height  font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: -1px; text-align: center; text-wrap: balance\">In 3 Schritten abgesichert.<\/h2>\n    <div style=\"margin-top: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px\">\n      <div style=\"background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 18px; padding: 28px\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #007AB3; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900\">1<\/div>\n        <div style=\"margin-top: 16px; font-size: 18px; font-weight: 800\">Formular ausfüllen<\/div>\n        <div style=\"margin-top: 6px; font-size: 15px; color: #C9DCF2; line-height: 1.55\">Tierart, Name, E-Mail — fertig. Dauert 30 Sekunden.<\/div>\n      <\/div>\n      <div style=\"background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 18px; padding: 28px\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #007AB3; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900\">2<\/div>\n        <div style=\"margin-top: 16px; font-size: 18px; font-weight: 800\">Angebot erhalten<\/div>\n        <div style=\"margin-top: 6px; font-size: 15px; color: #C9DCF2; line-height: 1.55\">Innerhalb von 24 Stunden bekommst du dein persönliches Angebot per E-Mail.<\/div>\n      <\/div>\n      <div style=\"background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 18px; padding: 28px\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #007AB3; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900\">3<\/div>\n        <div style=\"margin-top: 16px; font-size: 18px; font-weight: 800\">Entspannt zum Tierarzt<\/div>\n        <div style=\"margin-top: 6px; font-size: 15px; color: #C9DCF2; line-height: 1.55\">Ab sofort gilt: erst das Tier, dann die Rechnung. Wir kümmern uns.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section data-screen-label=\"Kundenstimmen\" style=\"background: #FFFFFF\">\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) 20px\">\n    <h2 style=\"margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: -1px; color: #003781; text-align: center; text-wrap: balance\">Das sagen Tierhalter:innen.<\/h2>\n    <div style=\"margin-top: clamp(28px, 4vw, 44px); display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px\">\n      <div style=\"background: #EFF6FB; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"color: #F2A93B; font-size: 17px; letter-spacing: 3px\">★★★★★<\/div>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #14233C; text-wrap: pretty\">„Nach der Magendrehung meines Labradors kamen 2.800 € zusammen. Erstattet in 5 Tagen. Ohne PfotenCheck hätte ich den falschen Tarif gehabt.“<\/div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-top: auto\">\n          <div style=\"width: 42px; height: 42px; border-radius: 50%; background: #003781; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px\">SK<\/div>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 800\">Sandra K.<\/div>\n            <div style=\"font-size: 13px; color: #5B6B83\">Labrador „Bruno“, München<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"background: #EFF6FB; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"color: #F2A93B; font-size: 17px; letter-spacing: 3px\">★★★★★<\/div>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #14233C; text-wrap: pretty\">„Angebot angefordert, am nächsten Morgen war es da. Klar erklärt, fairer Preis — meine Katze ist seit Januar versichert.“<\/div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-top: auto\">\n          <div style=\"width: 42px; height: 42px; border-radius: 50%; background: #007AB3; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px\">MT<\/div>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 800\">Murat T.<\/div>\n            <div style=\"font-size: 13px; color: #5B6B83\">Katze „Luna“, Köln<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"background: #EFF6FB; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"color: #F2A93B; font-size: 17px; letter-spacing: 3px\">★★★★★<\/div>\n        <div style=\"font-size: 16px; line-height: 1.6; color: #14233C; text-wrap: pretty\">„Bei Pferden wird es schnell fünfstellig. Endlich jemand, der Pferde-OP-Versicherungen wirklich vergleichen kann.“<\/div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-top: auto\">\n          <div style=\"width: 42px; height: 42px; border-radius: 50%; background: #003781; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px\">AB<\/div>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 800\">Anne B.<\/div>\n            <div style=\"font-size: 13px; color: #5B6B83\">Wallach „Caspar“, Lüneburg<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section data-screen-label=\"FAQ\" style=\"background: #EFF6FB\">\n  <div style=\"max-width: 820px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) 20px\">\n    <h2 style=\"margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 900; letter-spacing: -1px; color: #003781; text-align: center; text-wrap: balance\">Häufige Fragen.<\/h2>\n    <div style=\"margin-top: clamp(24px, 4vw, 40px); display: flex; flex-direction: column; gap: 12px\">\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DEEAF3; border-radius: 16px; overflow: hidden\">\n        <button onclick=\"{{ faqToggle.q1 }}\" style=\"width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border: none; background: transparent; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; color: #14233C\">Was kostet eine Tierkrankenversicherung?<span style=\"font-size: 22px; font-weight: 400; color: #007AB3; flex-shrink: 0\">{{ faqIcon.q1 }}<\/span><\/button>\n        <sc-if value=\"{{ faqOpen.q1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 0 20px 18px; font-size: 15px; line-height: 1.6; color: #5B6B83\">Das hängt von Tierart, Rasse, Alter und gewünschtem Schutz ab. Genau deshalb gibt es kein Pauschalangebot von der Stange — du bekommst von uns ein persönliches Angebot, das wirklich zu deinem Tier passt.<\/div>\n        <\/sc-if>\n      <\/div>\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DEEAF3; border-radius: 16px; overflow: hidden\">\n        <button onclick=\"{{ faqToggle.q2 }}\" style=\"width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border: none; background: transparent; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; color: #14233C\">Welche Tiere kann ich versichern?<span style=\"font-size: 22px; font-weight: 400; color: #007AB3; flex-shrink: 0\">{{ faqIcon.q2 }}<\/span><\/button>\n        <sc-if value=\"{{ faqOpen.q2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 0 20px 18px; font-size: 15px; line-height: 1.6; color: #5B6B83\">Hunde, Katzen und Pferde — vom Welpen bis zum Senior. Auch ältere Tiere lassen sich oft noch gut absichern; wir prüfen, welche Tarife in Frage kommen.<\/div>\n        <\/sc-if>\n      <\/div>\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DEEAF3; border-radius: 16px; overflow: hidden\">\n        <button onclick=\"{{ faqToggle.q3 }}\" style=\"width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border: none; background: transparent; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; color: #14233C\">Gibt es Wartezeiten?<span style=\"font-size: 22px; font-weight: 400; color: #007AB3; flex-shrink: 0\">{{ faqIcon.q3 }}<\/span><\/button>\n        <sc-if value=\"{{ faqOpen.q3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 0 20px 18px; font-size: 15px; line-height: 1.6; color: #5B6B83\">Die meisten Tarife haben eine Wartezeit von 30 Tagen bis 3 Monaten — bei Unfällen entfällt sie oft komplett. Tipp: Je früher du abschließt, desto besser.<\/div>\n        <\/sc-if>\n      <\/div>\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DEEAF3; border-radius: 16px; overflow: hidden\">\n        <button onclick=\"{{ faqToggle.q4 }}\" style=\"width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border: none; background: transparent; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; color: #14233C\">Mein Tier hat Vorerkrankungen — geht das trotzdem?<span style=\"font-size: 22px; font-weight: 400; color: #007AB3; flex-shrink: 0\">{{ faqIcon.q4 }}<\/span><\/button>\n        <sc-if value=\"{{ faqOpen.q4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 0 20px 18px; font-size: 15px; line-height: 1.6; color: #5B6B83\">Häufig ja. Bestehende Erkrankungen werden meist vom Schutz ausgenommen, alles andere bleibt versicherbar. Wir sagen dir ehrlich, was möglich ist — und was nicht.<\/div>\n        <\/sc-if>\n      <\/div>\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DEEAF3; border-radius: 16px; overflow: hidden\">\n        <button onclick=\"{{ faqToggle.q5 }}\" style=\"width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border: none; background: transparent; cursor: pointer; text-align: left; font-size: 16px; font-weight: 700; color: #14233C\">Ist die Anfrage wirklich kostenlos und unverbindlich?<span style=\"font-size: 22px; font-weight: 400; color: #007AB3; flex-shrink: 0\">{{ faqIcon.q5 }}<\/span><\/button>\n        <sc-if value=\"{{ faqOpen.q5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 0 20px 18px; font-size: 15px; line-height: 1.6; color: #5B6B83\">Ja, zu 100 %. Du bekommst ein Angebot per E-Mail und entscheidest in Ruhe. Kein Vertrag, keine versteckten Kosten, keine Anrufe ohne deine Zustimmung.<\/div>\n        <\/sc-if>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/section>\n\n<section data-screen-label=\"Finaler CTA\" style=\"background: #003781; color: #FFFFFF\">\n  <div style=\"max-width: 820px; margin: 0 auto; padding: clamp(48px, 7vw, 88px) 20px; text-align: center\">\n    <h2 style=\"margin: 0; font-size: clamp(28px, 4.5vw, 44px); font-weight: 900; letter-spacing: -1px; text-wrap: balance\">Warte nicht auf die nächste Rechnung.<\/h2>\n    <p style=\"margin: 14px auto 0; max-width: 520px; font-size: 17px; line-height: 1.6; color: #C9DCF2; text-wrap: pretty\">Jeder Tag ohne Schutz ist ein Risiko für dein Konto. Hol dir jetzt dein kostenloses Angebot — heute angefragt, morgen im Postfach.<\/p>\n    <button onclick=\"{{ scrollToForm }}\" style=\"margin-top: 28px; min-height: 56px; padding: 0 36px; border: none; border-radius: 14px; background: #007AB3; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,0.3)\" style-hover=\"background: #00608C\">Jetzt kostenloses Angebot sichern →<\/button>\n    <div style=\"margin-top: 14px; font-size: 13px; color: #9FBCDE\">100 % kostenlos · unverbindlich · Antwort in 24 h<\/div>\n  <\/div>\n<\/section>\n\n<footer data-screen-label=\"Footer\" style=\"background: #00295E; color: #9FBCDE; padding-bottom: 96px\">\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: 36px 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between\">\n    <div style=\"display: flex; align-items: center; gap: 10px\">\n      <div style=\"width: 28px; height: 28px; border-radius: 8px; background: #FFFFFF; color: #003781; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px\">P.<\/div>\n      <div style=\"font-weight: 800; font-size: 15px; color: #FFFFFF\">PfotenCheck.Net<\/div>\n    <\/div>\n    <div style=\"display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px\">\n      <a href=\"Impressum.html\" style=\"color: #9FBCDE; text-decoration: none\" style-hover=\"color: #FFFFFF\">Impressum<\/a>\n      <a href=\"Datenschutz.html\" style=\"color: #9FBCDE; text-decoration: none\" style-hover=\"color: #FFFFFF\">Datenschutz<\/a>\n      <a href=\"Kontakt.html\" style=\"color: #9FBCDE; text-decoration: none\" style-hover=\"color: #FFFFFF\">Kontakt<\/a>\n    <\/div>\n  <\/div>\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 20px 28px; font-size: 12.5px; line-height: 1.6; color: #6E8DB8\">PfotenCheck.Net ist ein unabhängiges Vermittlungsportal für Tierkrankenversicherungen. Alle Angaben ohne Gewähr. © 2026 PfotenCheck.Net<\/div>\n<\/footer>\n\n<sc-if value=\"{{ showStickyCta }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: rgba(255,255,255,0.97); border-top: 1px solid #E3ECF4; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0,20,55,0.12)\">\n    <button onclick=\"{{ scrollToForm }}\" style=\"width: 100%; min-height: 52px; border: none; border-radius: 14px; background: #007AB3; color: #FFFFFF; font-size: 16.5px; font-weight: 800; cursor: pointer\">Jetzt absichern — bevor es teuer wird →<\/button>\n  <\/div>\n<\/sc-if>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst API_BASE = 'https://leads.widimedia.com/api/public/v1';\nconst FUNNEL_TOKEN = '01M24GG1PE33SCVCBN8G66BFXJ'; // public_token des veroeffentlichten Funnels (ULID)\n\nclass Component extends DCLogic {\n  state = { tier: '', rasse: '', alter: '', name: '', email: '', phone: '', halterAlter: '', plz: '', gesundheit: '', website: '', submitted: false, sending: false, error: '', fieldErrors: {}, ageWarning: false, faq: {}, isMobile: false };\n\n  componentDidMount() {\n    this._mq = window.matchMedia('(max-width: 760px)');\n    this._mqHandler = () => this.setState({ isMobile: this._mq.matches });\n    if (this._mq.addEventListener) this._mq.addEventListener('change', this._mqHandler);\n    else this._mq.addListener(this._mqHandler);\n    this.setState({ isMobile: this._mq.matches });\n  }\n\n  componentWillUnmount() {\n    if (!this._mq) return;\n    if (this._mq.removeEventListener) this._mq.removeEventListener('change', this._mqHandler);\n    else this._mq.removeListener(this._mqHandler);\n  }\n\n  // Aendert ein Feld und raeumt die Fehlermeldung weg, die daran haengt\n  update = (patch, field) => {\n    this.setState((s) => {\n      const fieldErrors = Object.assign({}, s.fieldErrors);\n      if (field) delete fieldErrors[field];\n      return Object.assign({}, patch, { error: '', fieldErrors });\n    });\n  };\n\n  scrollToForm = () => {\n    const el = document.getElementById('lead-form');\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 70;\n    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });\n  };\n\n  submit = async (e) => {\n    e.preventDefault();\n    const { tier, rasse, alter, name, email, phone, halterAlter, plz, gesundheit, sending } = this.state;\n    if (sending) return;\n    if (!tier) { this.setState({ error: 'Bitte waehle aus: Hund, Katze oder Pferd.' }); return; }\n    if (!rasse.trim()) { this.setState({ error: 'Bitte gib die Rasse deines Tiers ein.' }); return; }\n    if (!alter.trim()) { this.setState({ error: 'Bitte gib das Alter deines Tiers ein.' }); return; }\n    if (!name.trim()) { this.setState({ error: 'Bitte gib deinen Namen ein.' }); return; }\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(email.trim())) { this.setState({ error: 'Bitte gib eine gueltige E-Mail-Adresse ein.' }); return; }\n    if (phone.replace(/\\D/g, '').length < 6) { this.setState({ error: 'Bitte gib eine gueltige Telefonnummer ein.' }); return; }\n    if (!halterAlter.trim() || isNaN(halterAlter) || +halterAlter < 18 || +halterAlter > 120) { this.setState({ error: 'Bitte gib dein Alter ein (18-120).' }); return; }\n    if (!/^\\d{5}$/.test(plz.trim())) { this.setState({ error: 'Bitte gib eine gueltige 5-stellige PLZ ein.' }); return; }\n    if (!gesundheit) { this.setState({ error: 'Bitte waehle den Gesundheitszustand des Tiers.' }); return; }\n\n    const tierAlterNum = parseInt(alter, 10);\n    if (tierAlterNum >= 8 && !this.state.ageWarning) {\n      this.setState({ ageWarning: true, error: '' });\n      return;\n    }\n\n    this.setState({ sending: true, error: '', fieldErrors: {}, ageWarning: false });\n\n    // Schritt 1: die vier Tierfelder\n    const stepAnswers = {\n      tierart: tier.toLowerCase(),           // hund | katze | pferd\n      rasse: rasse.trim(),\n      tier_alter: alter.trim(),\n      gesundheitszustand: gesundheit         // gesund | vorerkrankungen\n    };\n\n    // Abschluss: die Kontaktdaten, hier entsteht der Lead\n    const contactAnswers = {\n      name: name.trim(),\n      halter_alter: parseInt(halterAlter, 10),\n      plz: plz.trim(),\n      email: email.trim(),\n      telefon: phone.trim()\n    };\n\n    // Kampagnenparameter der Seite an den Sitzungsbeginn weiterreichen\n    const pageParams = new URLSearchParams(window.location.search);\n    const utm = new URLSearchParams();\n    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach((k) => {\n      const v = pageParams.get(k);\n      if (v) utm.set(k, v);\n    });\n    const utmQuery = utm.toString() ? '?' + utm.toString() : '';\n\n    const funnelBase = API_BASE + '/funnels/' + FUNNEL_TOKEN;\n\n    // Accept gehoert in jeden Aufruf. Ohne den Kopf antwortet Laravel bei einem\n    // Eingabefehler mit einem Redirect statt mit 422.\n    const asJson = { 'Content-Type': 'application/json', 'Accept': 'application/json' };\n\n    // Fehler kommen unter errors mit dem Praefix answers., also etwa answers.email.\n    // Praefix abschneiden, dann steht der Feldschluessel da und die Meldung laesst\n    // sich direkt am Eingabefeld ausgeben.\n    const readErrors = (payload) => {\n      const out = {};\n      const errors = payload && payload.errors;\n      if (errors) {\n        Object.keys(errors).forEach((key) => {\n          const list = errors[key];\n          const msg = Array.isArray(list) ? list[0] : list;\n          if (msg) out[key.replace(/^answers\\./, '')] = msg;\n        });\n      }\n      return out;\n    };\n    const summary = (fieldErrors, payload, fallback) => {\n      const keys = Object.keys(fieldErrors);\n      if (keys.length) return fieldErrors[keys[0]];\n      return (payload && payload.message) || fallback;\n    };\n    const showValidation = async (res) => {\n      const payload = await res.json().catch(() => null);\n      const fieldErrors = readErrors(payload);\n      this.setState({ sending: false, fieldErrors, error: summary(fieldErrors, payload, 'Bitte pruefe deine Eingaben.') });\n    };\n\n    try {\n      // 1. Sitzung beginnen. Zurueck kommt data.session_token, ein ULID.\n      //    Der lebt nur in dieser Variablen, es gibt kein Cookie.\n      const sessionRes = await fetch(funnelBase + '/sessions' + utmQuery, {\n        method: 'POST',\n        headers: asJson,\n        body: JSON.stringify({})\n      });\n      if (!sessionRes.ok) throw new Error('HTTP ' + sessionRes.status);\n      const sessionToken = (await sessionRes.json()).data.session_token;\n      const sessionUrl = funnelBase + '/sessions/' + sessionToken;\n\n      // 2. Die vier Tierfelder schicken. Danach steht current_step auf 2.\n      //    Kommt hier ein 422, bricht der Vorgang ab und es wird nicht abgesendet.\n      const patchRes = await fetch(sessionUrl + '/answers', {\n        method: 'PATCH',\n        headers: asJson,\n        body: JSON.stringify({ answers: stepAnswers })\n      });\n      if (patchRes.status === 422) { await showValidation(patchRes); return; }\n      if (!patchRes.ok) throw new Error('HTTP ' + patchRes.status);\n\n      // 3. Kontaktdaten absenden. website bleibt leer, das ist der Honigtopf\n      //    gegen Bots: gefuellt sieht die Antwort aus wie ein Erfolg, aber es\n      //    entsteht kein Lead.\n      const submitRes = await fetch(sessionUrl + '/submit', {\n        method: 'POST',\n        headers: asJson,\n        body: JSON.stringify({ answers: contactAnswers, website: this.state.website })\n      });\n      if (submitRes.status === 422) { await showValidation(submitRes); return; }\n      if (!submitRes.ok) throw new Error('HTTP ' + submitRes.status);\n\n      // Die Antwort traegt completed: true und phase: \"done\"\n      const done = await submitRes.json().catch(() => null);\n      if (done && done.data && done.data.completed === false) {\n        this.setState({ sending: false, error: 'Die Anfrage wurde nicht abgeschlossen. Bitte versuche es noch einmal.' });\n        return;\n      }\n\n      this.setState({ submitted: true, sending: false, fieldErrors: {} });\n    } catch (err) {\n      this.setState({ sending: false, error: 'Uebertragung fehlgeschlagen. Bitte versuche es gleich noch einmal.' });\n    }\n  };\n\n  renderVals() {\n    const { tier, rasse, alter, name, email, phone, halterAlter, plz, gesundheit, submitted, sending, error, fieldErrors, ageWarning, faq, isMobile } = this.state;\n    const fe = fieldErrors || {};\n\n    const tiere = ['Hund', 'Katze', 'Pferd'].map((label) => {\n      const sel = tier === label;\n      return {\n        label,\n        bg: sel ? '#003781' : '#F1F6FB',\n        color: sel ? '#FFFFFF' : '#14233C',\n        border: sel ? '#003781' : '#D6E3EF',\n        select: () => this.update({ tier: label }, 'tierart')\n      };\n    });\n\n    const faqOpen = {}, faqIcon = {}, faqToggle = {};\n    ['q1', 'q2', 'q3', 'q4', 'q5'].forEach((id) => {\n      faqOpen[id] = !!faq[id];\n      faqIcon[id] = faq[id] ? '\\u2212' : '+';\n      faqToggle[id] = () => this.setState((s) => ({ faq: Object.assign({}, s.faq, { [id]: !s.faq[id] }) }));\n    });\n\n    return {\n      tiere,\n      formRasse: rasse,\n      setRasse: (e) => this.update({ rasse: e.target.value }, 'rasse'),\n      formAlter: alter,\n      setAlter: (e) => this.update({ alter: e.target.value }, 'tier_alter'),\n      formName: name,\n      formEmail: email,\n      tierLabel: tier ? 'dein' + (tier === 'Hund' ? 'en Hund' : tier === 'Katze' ? 'e Katze' : ' Pferd') : 'dein Tier',\n      setName: (e) => this.update({ name: e.target.value }, 'name'),\n      setEmail: (e) => this.update({ email: e.target.value }, 'email'),\n      formPhone: phone,\n      setPhone: (e) => this.update({ phone: e.target.value }, 'telefon'),\n      formHalterAlter: halterAlter,\n      setHalterAlter: (e) => this.update({ halterAlter: e.target.value }, 'halter_alter'),\n      formPlz: plz,\n      setPlz: (e) => this.update({ plz: e.target.value }, 'plz'),\n      gesundheitOptionen: [\n        { label: 'Gesund', value: 'gesund' },\n        { label: 'Vorerkrankungen', value: 'vorerkrankungen' }\n      ].map((opt) => {\n        const sel = gesundheit === opt.value;\n        return {\n          label: opt.label,\n          bg: sel ? '#003781' : '#F1F6FB',\n          color: sel ? '#FFFFFF' : '#14233C',\n          border: sel ? '#003781' : '#D6E3EF',\n          select: () => this.update({ gesundheit: opt.value }, 'gesundheitszustand')\n        };\n      }),\n      formWebsite: this.state.website,\n      setWebsite: (e) => this.setState({ website: e.target.value }),\n      submit: this.submit,\n      sending,\n      notSending: !sending,\n      submitted,\n      notSubmitted: !submitted,\n      error,\n      hasError: !!error,\n      errTierart: fe.tierart || '', hasErrTierart: !!fe.tierart,\n      errRasse: fe.rasse || '', hasErrRasse: !!fe.rasse,\n      errTierAlter: fe.tier_alter || '', hasErrTierAlter: !!fe.tier_alter,\n      errGesundheit: fe.gesundheitszustand || '', hasErrGesundheit: !!fe.gesundheitszustand,\n      errName: fe.name || '', hasErrName: !!fe.name,\n      errHalterAlter: fe.halter_alter || '', hasErrHalterAlter: !!fe.halter_alter,\n      errPlz: fe.plz || '', hasErrPlz: !!fe.plz,\n      errEmail: fe.email || '', hasErrEmail: !!fe.email,\n      errTelefon: fe.telefon || '', hasErrTelefon: !!fe.telefon,\n      ageWarning,\n      confirmAge: () => this.submit({ preventDefault: () => {} }),\n      cancelAge: () => this.setState({ ageWarning: false }),\n      faqOpen, faqIcon, faqToggle,\n      scrollToForm: this.scrollToForm,\n      showStickyCta: isMobile && !submitted\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
